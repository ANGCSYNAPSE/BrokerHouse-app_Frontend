workflows:
  android-workflow:
    name: BrokrsHouse Android
    max_build_duration: 30
    instance_type: linux
    environment:
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Run tests
        script: flutter test
      - name: Build debug APK
        script: flutter build apk --debug
        # Once you're ready for real releases, add an Android keystore in
        # Codemagic's code-signing settings, switch this to
        # `flutter build appbundle --release`, and publish to Play Store
        # via the `publishing` block below.
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
    # Add a `publishing:` block here (email, Slack, Play Store, etc.) once
    # you know how you want to be notified — configurable in Codemagic's
    # UI too, no need to hardcode it in this file.

  ios-workflow:
    name: BrokrsHouse iOS
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Run tests
        script: flutter test
      - name: Build iOS (unsigned)
        script: flutter build ios --release --no-codesign
        # This verifies the iOS build compiles, but produces an unsigned
        # build that can't run on a real device or go to TestFlight yet.
        # Once you're enrolled in the Apple Developer Program, add your
        # signing certificate + provisioning profile in Codemagic's
        # code-signing settings, switch to `flutter build ipa`, and add a
        # `publishing.app_store_connect` block to auto-upload to TestFlight.
    artifacts:
      - build/ios/iphoneos/*.app
    # Add a `publishing:` block here (email, TestFlight via
    # app_store_connect, etc.) once you know how you want to be notified.
