name: brokerhouse_app
description: "BrokrsHouse — Real Estate D2B + B2B + B2C Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Networking
  dio: ^5.7.0

  # Routing
  go_router: ^14.6.2

  # Secure token storage (access/refresh tokens)
  flutter_secure_storage: ^9.2.2

  # Model (de)serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Utilities
  intl: ^0.19.0
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  logger: ^2.5.0
  pretty_dio_logger: ^1.4.0
  flutter_svg: ^2.0.14
  pin_code_fields: ^8.0.1
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Codegen
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.0

  # App icon generation — see tool/README or run:
  # dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/icon/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon_ios.png"
  adaptive_icon_background: "#0A1628"
  adaptive_icon_foreground: "assets/icon/app_icon_adaptive_fg.png"
  remove_alpha_ios: true
